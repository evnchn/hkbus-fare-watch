name: Fare watch

on:
  schedule:
    - cron: "0 1 * * *"   # 09:00 HKT, after the 05:10 crawl has published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python farewatch.py
      - name: Commit the feed if it moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json feed.xml report.md
          git diff --cached --quiet || git commit -m "Fare watch $(date -u +%Y-%m-%d)"
          git push
